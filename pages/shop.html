<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101010">
<meta name="description" content="Khám phá bộ sưu tập áo, giày và phụ kiện Fluw Shop, tìm kiếm và sắp xếp sản phẩm.">
<title>Tất cả sản phẩm | Fluw Shop</title><link rel="stylesheet" href="../assets/css/store.css">
<script type="module" src="../assets/js/layout/header.js"></script><script type="module" src="../assets/js/layout/footer.js"></script>
<script type="module" src="../assets/js/shop/shop-page.js"></script>
</head><body><fluw-header base-path="../"></fluw-header><main>
<section class="page-banner"><div class="page-width"><span class="eyebrow">FLUW / SHOP ALL</span><h1>Khám phá tất cả.</h1><p>Lọc theo danh mục, tìm tên sản phẩm và khám phá bộ sưu tập hiện có.</p></div></section>
<section class="page-width section"><form class="filter-panel" id="catalog-filters" role="search">
<div class="form-field"><label for="catalog-search">Tìm kiếm</label><input id="catalog-search" type="search" name="q" placeholder="Tên áo, giày, phụ kiện..."></div>
<div class="form-field"><label for="catalog-group">Danh mục</label><select id="catalog-group"><option value="all">Tất cả</option><option value="shirt">Thời trang</option><option value="shoe">Giày dép</option><option value="accessory">Phụ kiện</option></select></div>
<div class="form-field"><label for="catalog-sort">Sắp xếp</label><select id="catalog-sort"><option value="featured">Mặc định</option><option value="price-asc">Giá tăng dần</option><option value="price-desc">Giá giảm dần</option><option value="name">Tên A–Z</option></select></div>
<button class="btn btn-primary" type="submit">Tìm sản phẩm</button></form>
<div class="result-meta"><span id="result-count" role="status">Đang tải...</span><span class="muted">Giá và sản phẩm mang tính minh họa</span></div>
<div id="catalog-grid" class="product-grid"></div><div id="catalog-empty" class="empty-state" hidden><h2>Không tìm thấy sản phẩm</h2><p>Thử một từ khóa hoặc danh mục khác.</p></div>
</section></main><fluw-footer base-path="../"></fluw-footer></body></html>
